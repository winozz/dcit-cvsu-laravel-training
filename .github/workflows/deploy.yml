name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pdo_sqlite
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Create SQLite database
        run: touch database/database.sqlite

      - name: Run migrations
        run: php artisan migrate

      - name: Run tests
        run: php artisan test

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to production
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
          set -e

          # 1. Login to GHCR and pull latest image
          echo "Pulling latest Docker image..."
          echo "$GHCR_TOKEN" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker pull $IMAGE_NAME:latest

          # 2. Update source code
          echo "Updating source code..."
          cd $DEPLOY_PATH
          git pull origin main

          # 3. Build frontend assets
          echo "Building frontend assets..."
          docker run --rm \
            -v $(pwd):/var/www/html \
            -w /var/www/html \
            node:20-alpine \
            sh -c "npm ci && npm run build"

          # 4. Restart containers
          echo "Restarting application containers..."
          docker compose up -d --no-deps --force-recreate app queue

          # 5. Wait for healthcheck
          echo "Waiting for application to be healthy..."
          for i in $(seq 1 12); do
            if docker compose exec app curl -sf http://localhost:8080/up > /dev/null 2>&1; then
              echo "Application is healthy"
              break
            fi
            if [ $i -eq 12 ]; then
              echo "Healthcheck failed after 60 seconds"
              exit 1
            fi
            sleep 5
          done

          # 6. Run migrations
          echo "Running database migrations..."
          docker compose exec app php artisan migrate --force

          # 7. Clear and cache
          echo "Clearing and caching configuration..."
          docker compose exec app php artisan cache:clear
          docker compose exec app php artisan config:clear
          docker compose exec app php artisan route:cache
          docker compose exec app php artisan view:cache

          # 8. Verify Cloudflare Tunnel
          echo "Verifying Cloudflare Tunnel..."
          systemctl is-active cloudflared > /dev/null 2>&1 || systemctl restart cloudflared
          sleep 2
          curl -sf http://localhost:8087/up > /dev/null 2>&1 && echo "Tunnel verified" || echo "Warning: Tunnel health check inconclusive"

          # 9. Display status
          echo "=== Container Status ==="
          docker compose ps
          echo ""
          echo "=== Resource Usage ==="
          docker stats --no-stream

          echo "✅ Deployment completed successfully"
          EOF
